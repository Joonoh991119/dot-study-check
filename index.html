<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Check your computer</title>
    <!--
      The self-check page (bsr-v4, decision 5; src/pages/selfcheck.ts): the study's device check and refresh measurement,
      one row per requirement; no identifier is read, nothing is stored or sent. Its texts are text.en.online.selfcheck of
      config/experiments/pilot_bsr_v4.json, bundled at build time.
    -->
    <style>
      :root {
        --ink: #111;
        --muted: #444;
        --line: #c8c8c8;
        --bad: #a40000;
        --good: #0b6b2b;
      }
      html,
      body {
        margin: 0;
        background: #f4f4f4;
        color: var(--ink);
        font: 18px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      h1 {
        font-size: 1.5em;
        margin: 0 0 0.6em;
      }
      #selfcheck-lines p {
        margin: 0 0 0.6em;
      }
      ul.rows {
        list-style: none;
        margin: 1.2em 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      li.row {
        display: flex;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      li.row .mark {
        flex: 0 0 5.5em;
        font-weight: 700;
      }
      li.row[data-state='pass'] .mark {
        color: var(--good);
      }
      li.row[data-state='fail'] .mark {
        color: var(--bad);
      }
      li.row .what {
        display: flex;
        flex-direction: column;
      }
      li.row .found {
        color: var(--muted);
      }
      ul.fix {
        margin: 0.4em 0 0;
        padding-left: 1.2em;
      }
      p.summary {
        font-weight: 600;
      }
      button {
        font: inherit;
        padding: 10px 22px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
    <script type="module" crossorigin src="./assets/selfcheck.js"></script>
  </head>
  <body>
    <main>
      <h1 id="selfcheck-title"></h1>
      <div id="selfcheck-lines"></div>
      <div id="selfcheck-rows" aria-live="polite"></div>
      <button id="selfcheck-again" type="button" disabled></button>
    </main>
  </body>
</html>
